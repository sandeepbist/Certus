version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directories:
      - /services/embedding
      - /services/gateway
      - /services/ingestion
      - /services/mcp-tools
      - /services/orchestration
      - /services/web
      - /services/workflows
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
