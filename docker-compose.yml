services:
  # ============================================================
  # PostgreSQL 17 with pgvector 0.8.x extension
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    container_name: nexus-postgres
    restart: unless-stopped
    network_mode: host
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; run make setup for local development}
      POSTGRES_DB: ${POSTGRES_DB:-nexus}
      CERTUS_RUNTIME_DB_USER: ${CERTUS_RUNTIME_DB_USER:-certus_runtime}
      CERTUS_RUNTIME_DB_PASSWORD: ${CERTUS_RUNTIME_DB_PASSWORD:?CERTUS_RUNTIME_DB_PASSWORD is required; run make setup for local development}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          case "$${CERTUS_RUNTIME_DB_USER}" in ''|*[!A-Za-z0-9_]*|[0-9]*) exit 1 ;; esac &&
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" &&
          psql -X -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -tAc
          "SELECT 1 FROM pg_roles AS role WHERE role.rolname = '$${CERTUS_RUNTIME_DB_USER}'
          AND role.rolcanlogin AND NOT role.rolsuper AND NOT role.rolcreatedb AND NOT role.rolcreaterole
          AND NOT role.rolreplication AND NOT role.rolbypassrls
          AND has_database_privilege(role.oid, current_database(), 'CONNECT')
          AND NOT has_database_privilege(role.oid, current_database(), 'CREATE')
          AND NOT has_database_privilege(role.oid, current_database(), 'TEMPORARY')
          AND has_schema_privilege(role.oid, 'public', 'USAGE')
          AND NOT has_schema_privilege(role.oid, 'public', 'CREATE')" | grep -qx 1 &&
          PGREQUIREAUTH=password,md5,scram-sha-256 PGPASSWORD="$${CERTUS_RUNTIME_DB_PASSWORD}" psql
          -X -h 127.0.0.1 -p 5432
          -U "$${CERTUS_RUNTIME_DB_USER}" -d "$${POSTGRES_DB}" -tAc "SELECT 1" | grep -qx 1
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  # ============================================================
  # Neo4j 5.x Graph Database
  # ============================================================
  neo4j:
    image: neo4j:5-community@sha256:3388e05ee53c8313d01acdf33e63ad175af95a92226dc8551160564439ce2c8c
    container_name: nexus-neo4j
    restart: unless-stopped
    network_mode: host
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-nexus_neo4j_dev}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4jdata:/data

  # ============================================================
  # Redis 7.x Cache & Streams
  # ============================================================
  redis:
    image: redis:7-alpine@sha256:520775a41a63e77e06c73e35d2fd9cc15921a609516818796b4ecbb813078bc7
    container_name: nexus-redis
    restart: unless-stopped
    network_mode: host
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  # ============================================================
  # RustFS S3-compatible object storage (isolated local use only)
  # ============================================================
  object-storage:
    image: rustfs/rustfs:1.0.0-beta.12@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    container_name: certus-object-storage
    restart: unless-stopped
    network_mode: host
    command: ["/data"]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      RUSTFS_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-certus-local-access-key}
      RUSTFS_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-certus-local-secret-key-change-me}
      RUSTFS_ADDRESS: 127.0.0.1:9000
      RUSTFS_CONSOLE_ADDRESS: 127.0.0.1:9001
    volumes:
      - objectdata:/data
    tmpfs:
      - /logs:rw,noexec,nosuid,nodev,uid=10001,gid=10001,size=64m
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,size=64m

  # ============================================================
  # Temporal Server (Local Development Engine)
  # ============================================================
  temporal:
    image: temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    container_name: nexus-temporal
    restart: unless-stopped
    network_mode: host
    command:
      [
        "server", "start-dev",
        "--ip", "0.0.0.0",
        "--db-filename", "/home/temporal/temporal.db",
        "--namespace", "${TEMPORAL_NAMESPACE:-nexus}"
      ]
    volumes:
      - temporaldata:/home/temporal

  # ============================================================
  # Temporal workflow worker + automation event dispatcher
  # ============================================================
  workflows:
    build:
      context: .
      dockerfile: services/workflows/Dockerfile
      network: host
    container_name: certus-workflows
    restart: unless-stopped
    stop_grace_period: 45s
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      neo4j:
        condition: service_started
      temporal:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must use CERTUS_RUNTIME_DB_USER and CERTUS_RUNTIME_DB_PASSWORD}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      NOTIFICATION_EVENT_RETENTION_DAYS: ${NOTIFICATION_EVENT_RETENTION_DAYS:-30}
      REALTIME_EVENT_RETENTION_DAYS: ${REALTIME_EVENT_RETENTION_DAYS:-30}
      AUTOMATION_EVENT_RETENTION_DAYS: ${AUTOMATION_EVENT_RETENTION_DAYS:-30}
      OUTBOX_PUBLISHED_RECOVERY_SECONDS: ${OUTBOX_PUBLISHED_RECOVERY_SECONDS:-300}
      EMBEDDING_JOB_RETENTION_DAYS: ${EMBEDDING_JOB_RETENTION_DAYS:-7}
      EMBEDDING_PROCESSING_LEASE_SECONDS: ${EMBEDDING_PROCESSING_LEASE_SECONDS:-300}
      WORKFLOWS_DB_CONNECT_TIMEOUT_SECONDS: ${WORKFLOWS_DB_CONNECT_TIMEOUT_SECONDS:-3}
      WORKFLOWS_REDIS_CONNECT_TIMEOUT_SECONDS: ${WORKFLOWS_REDIS_CONNECT_TIMEOUT_SECONDS:-3}
      WORKFLOWS_REDIS_SOCKET_TIMEOUT_SECONDS: ${WORKFLOWS_REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      WORKFLOWS_DEPENDENCY_CONNECT_TIMEOUT_SECONDS: ${WORKFLOWS_DEPENDENCY_CONNECT_TIMEOUT_SECONDS:-5}
      WORKFLOWS_NEO4J_TIMEOUT_SECONDS: ${WORKFLOWS_NEO4J_TIMEOUT_SECONDS:-5}
      WORKER_HEARTBEAT_INTERVAL_SECONDS: ${WORKER_HEARTBEAT_INTERVAL_SECONDS:-10}
      WORKER_DB_STATEMENT_TIMEOUT_MS: ${WORKER_DB_STATEMENT_TIMEOUT_MS:-15000}
      WORKER_DB_LOCK_TIMEOUT_MS: ${WORKER_DB_LOCK_TIMEOUT_MS:-3000}
      NEO4J_URI: ${NEO4J_URI:-bolt://localhost:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-nexus_neo4j_dev}
      TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-localhost:7233}
      TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-nexus}
      TEMPORAL_TASK_QUEUE: ${TEMPORAL_TASK_QUEUE:-certus-workflows}
      NODE_ENV: ${NODE_ENV:-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-false}

volumes:
  pgdata:
    driver: local
  neo4jdata:
    driver: local
  redisdata:
    driver: local
  temporaldata:
    driver: local
  objectdata:
    driver: local
